# Written by fpgas.online-infra (roles/onpi/tasks/fpga_verify.yml) into the Pi root of an fpgas.online site.
# fpgas-verify reads every *.ini here; a key it does not know is ignored.
#
# publish: on a fleet Pi the boot check reports its result to the site (the `fpga-verified` fleet event),
# which is what lets the site list the board. Someone running fpgas-verify on their own machine gets no
# publishing unless they ask for it; the fleet's root asks for it here.
[verify]
publish = on
