# The kernels the LitePCIe driver is built for (packaging/acorn-litepcie/, design
# docs/plans/2026-09-25-acorn-litepcie-packages-design.md §4.2).
#
# fleet_kernel: the kernel the netbooted fleet boots (arm64 kernel, armhf userland). Every pull request
# builds its modules package, and the raw litepcie.ko and liteuart.ko as a workflow artifact, since DKMS
# cannot serve that host shape. Move it in the same reviewed PR that moves the fleet's kernel. CI fails
# unless it is one of the kernels built below.
fleet_kernel = "6.12.109+rpt-rpi-v8"
fleet_suite = "bookworm"

# The kernel floor: no modules are built or kept for kernels below it. CI fails if fleet_kernel is below it.
min_kernel = "6.12"

# The Raspberry Pi kernel flavours that get a prebuilt fpgas-online-acorn-litepcie-modules-<kver> package,
# per suite and per kernel architecture: every linux-headers-<kver>-<flavour> of the Raspberry Pi archive
# at or above min_kernel. These are the kernels a Pi 5 can boot. Another flavour is one more list entry
# (a 32-bit one goes in an `armhf = [...]` line).
[suites.bookworm]
arm64 = ["rpi-v8", "rpi-2712"]

[suites.trixie]
arm64 = ["rpi-v8", "rpi-2712"]
