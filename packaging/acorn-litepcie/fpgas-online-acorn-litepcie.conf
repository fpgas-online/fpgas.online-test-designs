# fpgas-online-acorn-litepcie-common: never load litepcie.ko just because an Acorn is on the bus.
#
# litepcie.ko's PCI ID table matches every Acorn running the fpgas.online SoC (10ee:7021), so without this
# line udev would load it at every boot. Loaded, it holds BAR0, which fpgas-acorn-verify and fpgas-acorn-flash
# then have to take from it, so it is only ever loaded on purpose: `modprobe litepcie` still works.
blacklist litepcie
