# fpgas-online-acorn-litepcie-common: never load litepcie.ko just because an Acorn is on the bus.
#
# litepcie.ko's PCI ID table matches every Acorn running the fpgas.online SoC (10ee:7021), so without this
# line udev would load it at every boot. Loading it resets the SoC and takes BAR0 from fpgas-acorn-verify and
# fpgas-acorn-flash, so it is only ever loaded on purpose: `modprobe litepcie` still works.
blacklist litepcie
