# The Acorn PCIe SoC release the fleet is expected to carry, and the only input to
# fpgas-online-acorn-bitstreams (packaging/acorn-pcie/build_debs.py). The manifest must hash to
# manifest_sha256 and every asset to its manifest entry, or the build fails.
#
# Moving this pin is what changes the images every Acorn host checks its flash against, and which
# images an operator's reset puts back: change it only in a reviewed PR, after the new release has been
# published by designs/acorn-pcie/tools/publish_release.py and checked on a board.
#
# vivado-bitstreams-acorn-pcie-20260923-ge48a750c8303: built with Vivado 2025.2 from e48a750 (test-designs
# #35, the PIPECLK/USERCLK skew fix; its gateware is byte-identical to main at 938b7cb), published 2026-09-24.
# Its cle-215+ operational image (identifier "... cle-215+ 2026-09-24 00:16:54") ran on pi-sw2-p48 from SRAM:
# Gen2 x1, clean identifier and scratch round trips. No board carries it in flash yet.
