# .github/workflows/acorn-pcie-build.yml
#
# The Acorn PCIe SoC (designs/acorn-pcie/gateware/acorn_pcie_soc.py), built with the open-source flow
# (openXC7: Yosys, nextpnr-xilinx, prjxray) for every variant, as the operational and the golden image.
#
# EXPECTED TO FAIL, AND NOT SHIPPED (issue #105). openXC7 cannot build this SoC yet: nextpnr-xilinx has no
# XADC site, and without the XADC the design misses timing (80 MHz system clock, 250 MHz PCIe PIPE clock).
# Tim, 2026-10-02: keep building it in CI, never let it block anything, and do not ship its bitstreams.
#   * Each job is green when the build fails for a reason #105 records, red when it fails for any other
#     reason or when it unexpectedly passes (scripts/openxc7_expected_failure.py). It never fails the workflow
#     (continue-on-error), and no other workflow waits for it.
#   * collect-bitstreams.yml neither waits for this workflow nor bundles its artifacts, so no package carries
#     them; tests/test_unshipped_bitstreams.py fails CI if that changes.
#   * What the fleet's flash carries is the Vivado build of the same source, published by
#     designs/acorn-pcie/tools/publish_release.py. No openXC7 build of this SoC has run on a board.
#
# A build that misses timing fails: the SoC gives nextpnr-xilinx every clock's period and runs it in strict
# mode (designs/_shared/platform_fixups.py require_timing), trying up to five seeds.
name: "Build: Acorn PCIe SoC"

# Six builds of up to an hour each, on a runner pool every workflow shares: on a pull request only when the
# change can affect them.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - designs/acorn-pcie/**
      - designs/_shared/**
      - designs/pcie-enumeration/gateware/pcie_7x/**
      - scripts/openxc7_build_report.py
      - scripts/openxc7_expected_failure.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/acorn-pcie-build.yml
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older, now stale, run.
# Anything else (main, workflow_dispatch) is grouped by commit, so it never waits
# behind or cancels another run: every merge builds, exactly as before.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "${{ matrix.board }} (${{ matrix.image }} image, expected to fail: #105)"
    runs-on: ubuntu-latest
    continue-on-error: true # never fails the workflow, whatever the result: see the header
    timeout-minutes: 150
    container:
      image: regymm/openxc7
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: "Acorn CLE-215+", variant: "cle-215+", slug: "cle-215plus", image: "operational", flags: ""}
          - {board: "Acorn CLE-215+", variant: "cle-215+", slug: "cle-215plus", image: "golden", flags: "--golden"}
          - {board: "NiteFury (CLE-215)", variant: "cle-215", slug: "cle-215", image: "operational", flags: ""}
          - {board: "NiteFury (CLE-215)", variant: "cle-215", slug: "cle-215", image: "golden", flags: "--golden"}
          - {board: "LiteFury (CLE-101)", variant: "cle-101", slug: "cle-101", image: "operational", flags: ""}
          - {board: "LiteFury (CLE-101)", variant: "cle-101", slug: "cle-101", image: "golden", flags: "--golden"}
    env:
      # acorn_pcie_soc.py's output directory: build/acorn-<variant>, with -golden for the golden image.
      BUILD_DIR: designs/acorn-pcie/build/acorn-${{ matrix.variant }}${{ matrix.image == 'golden' && '-golden' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cross compiler and Python tooling
        run: |
          apt-get update
          apt-get install -y gcc-riscv64-unknown-elf curl git
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "/prjxray/env/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: uv sync --python 3.12 --extra build

      - name: Install FASM GTP fixup wrapper
        run: |
          [ -f /prjxray/env/bin/fasm2frames.real ] || mv /prjxray/env/bin/fasm2frames /prjxray/env/bin/fasm2frames.real
          cp designs/_shared/fasm2frames_wrapper.py /prjxray/env/bin/fasm2frames
          chmod +x /prjxray/env/bin/fasm2frames

      - name: Toolchain versions
        run: |
          yosys -V
          nextpnr-xilinx --version

      - name: Build ${{ matrix.board }} ${{ matrix.image }} bitstream
        id: build
        continue-on-error: true # judged by the next step
        shell: bash
        env:
          CHIPDB: /chipdb
          PRJXRAY_DB_DIR: /nextpnr-xilinx/xilinx/external/prjxray-db
          NEXTPNR_XILINX_PYTHON_DIR: /nextpnr-xilinx/xilinx/python
          VARIANT: ${{ matrix.variant }}
          FLAGS: ${{ matrix.flags }}
        run: |
          set -o pipefail
          uv run python designs/acorn-pcie/gateware/acorn_pcie_soc.py \
            --variant "$VARIANT" \
            --toolchain openxc7 \
            $FLAGS \
            --build 2>&1 | tee build.log

      - name: Expected failure (#105)?
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: uv run --no-project python scripts/openxc7_expected_failure.py --outcome "$OUTCOME" --log build.log

      - name: Timing, utilisation and placement report
        if: always() && steps.build.outcome == 'success' # also after an unexpected pass
        run: |
          uv run python scripts/openxc7_build_report.py "$BUILD_DIR/gateware" sqrl_acorn \
            > "$BUILD_DIR/gateware/sqrl_acorn_report.md"
          cat "$BUILD_DIR/gateware/sqrl_acorn_report.md"
          cat "$BUILD_DIR/gateware/sqrl_acorn_report.md" >> "$GITHUB_STEP_SUMMARY"

      # Never bundled or shipped: collect-bitstreams.yml leaves out every acorn-pcie-soc-openxc7-* artifact.
      - name: Upload bitstream, CSR map and reports
        if: always() && steps.build.outcome == 'success' # also after an unexpected pass
        uses: actions/upload-artifact@v4
        with:
          name: acorn-pcie-soc-openxc7-${{ matrix.slug }}-${{ matrix.image }}
          path: |
            ${{ env.BUILD_DIR }}/gateware/sqrl_acorn.bit
            ${{ env.BUILD_DIR }}/csr.json
            ${{ env.BUILD_DIR }}/csr.csv
            ${{ env.BUILD_DIR }}/gateware/sqrl_acorn_report.md
            ${{ env.BUILD_DIR }}/gateware/sqrl_acorn_nextpnr.log
            ${{ env.BUILD_DIR }}/gateware/sqrl_acorn.rpt
          if-no-files-found: error

      # What a failed build leaves behind, to find out why without running it again.
      - name: Upload logs of a failed build
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: acorn-pcie-soc-openxc7-${{ matrix.slug }}-${{ matrix.image }}-failed-logs
          path: |
            ${{ env.BUILD_DIR }}/gateware/sqrl_acorn_nextpnr.log
            ${{ env.BUILD_DIR }}/gateware/sqrl_acorn.rpt
            ${{ env.BUILD_DIR }}/gateware/sqrl_acorn.xdc
            ${{ env.BUILD_DIR }}/gateware/build_sqrl_acorn.sh
          if-no-files-found: warn
