# .github/workflows/lint.yml
name: "Lint"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older, now stale, run.
# Anything else (main, workflow_dispatch) is grouped by commit, so it never waits
# behind or cancels another run: every merge builds, exactly as before.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Ruff (Python)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Lint all Python
        run: |
          uv run --extra dev ruff check \
            designs/ \
            verify_hardware.py

  unit-tests:
    name: "Unit tests (pytest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Host-script logic that must be right without hardware, e.g. the TT
      # PMOD wiring test against its simulated board (see [tool.pytest] in
      # pyproject.toml for what is collected).
      - name: Run unit tests
        run: uv run --extra dev pytest -q
