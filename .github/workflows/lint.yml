# .github/workflows/lint.yml
name: "Lint"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: "Ruff (Python)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Lint all Python
        run: |
          uv run --extra dev ruff check \
            designs/ \
            verify_hardware.py

  unit-tests:
    name: "Unit tests (pytest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Host-script logic that must be right without hardware: the pin-id
      # verdict and the TT PMOD wiring test against its simulated board.
      - name: Run unit tests
        run: uv run --extra dev pytest -q
