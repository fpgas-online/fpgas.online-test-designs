# .github/workflows/acorn-litepcie.yml
#
# The builds of the LitePCIe driver packages for the Acorn SoC (packaging/acorn-litepcie/, design
# docs/plans/2026-09-25-acorn-litepcie-packages-design.md). deb.yml calls this workflow as its build-deb job
# and publishes what it hands over. Started by hand on any branch, it builds every kernel's modules (the
# `full` input) and publishes nothing.
#
#   plan      the versions (the shared deb-version action, on the driver commit), which Raspberry Pi kernels
#             get a -modules-<kver> package, and which debs the live site already has (plan.py)
#   driver    generate the driver at this commit from acorn_pcie_soc.py (no Vivado), apply the three
#             packaging patches, cross-check its CSRs against all six images of the pinned release, and build
#             -common and -dkms for each suite and the meta package
#   utils     litepcie_util and litepcie_test for armhf, arm64 and amd64 in each suite's Debian image, the
#             struct-layout asserts, the -utils deb, and an install test
#   dkms      a DKMS build in the shapes DKMS is for, per suite: an arm64 root with the newest rpi-v8 headers,
#             and an amd64 root with Debian's headers
#   modules   one job per suite and kernel: litepcie.ko and liteuart.ko built in the suite's Debian image
#             against that kernel's headers, packaged as -modules-<kver>, then installed through apt on an
#             armhf root with the arm64 kernel, as the netbooted fleet is; there the meta package must keep
#             to the modules and not bring DKMS. The fleet kernel's job also uploads the two .ko files as a
#             workflow artifact
#   assemble  per suite, the debs-<suite> artifact publish-apt takes: every deb the site already has at this
#             version, from the site; the rest from this run's builds
#   meta      per suite, on a plain arm64 host: the meta package, from the assembled suite, must choose DKMS
#
# A run is a sample or full (plan.py). A sample builds the modules of the newest kernel of each suite and
# flavour and of the fleet kernel: pull requests, and every run while there is no Pages site to publish to.
# A full run builds the modules of every kernel the site lacks at this driver version (all of them after a
# driver change, only a newly released kernel on a quiet day), and its debs-<suite> are complete.
name: "Acorn LitePCIe builds"

on:
  workflow_call:
    outputs:
      mode:
        description: "`full` when the debs-<suite> artifacts hold every package and can be published; else `sample`"
        value: ${{ jobs.plan.outputs.mode }}
      suites-list:
        description: "The suites built, space-separated"
        value: ${{ jobs.plan.outputs.suites-list }}
      meta-version:
        description: "The meta package's version: the driver's X.Y.postN, with ~pr<P> on a pull request"
        value: ${{ jobs.plan.outputs.meta-version }}
  workflow_dispatch:
    inputs:
      full:
        description: "Build the modules of every kernel, not the sample (nothing is published either way)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  NFPM_VERSION: "2.47.0"
  NFPM_SHA256_X86_64: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
  NFPM_SHA256_ARM64: "1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c"

jobs:
  plan:
    name: "Versions and plan"
    runs-on: ubuntu-latest
    # pages: read is for asking GitHub where this repository's Pages site is. Without a site the answer is
    # 404, and so it is without the permission to ask: the plan would take a published archive for none.
    permissions:
      contents: read
      pages: read
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      meta-version: ${{ steps.sid.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      mode: ${{ steps.plan.outputs.mode }}
      suites: ${{ steps.plan.outputs.suites }}
      suites-list: ${{ steps.plan.outputs.suites-list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is git describe of the driver inputs' last first-parent commit

      # The shared version script versions a checkout. The driver packages are versioned by the last commit
      # that changed what they are built from, not by HEAD, so it gets a checkout of that commit.
      - name: Check out the commit the driver packages are versioned by
        run: python3 packaging/acorn-litepcie/build_debs.py --version-tree dist/version-tree

      - name: Version (bookworm)
        id: bookworm
        uses: mithro/apt-repo-action/deb-version@main
        with:
          suite: bookworm
          source-dir: dist/version-tree

      - name: Version (trixie)
        id: trixie
        uses: mithro/apt-repo-action/deb-version@main
        with:
          suite: trixie
          source-dir: dist/version-tree

      # sid carries no suite suffix: the meta package is one file for every suite.
      - name: Version (the meta package)
        id: sid
        uses: mithro/apt-repo-action/deb-version@main
        with:
          suite: sid
          source-dir: dist/version-tree

      # Reads the Raspberry Pi archive's indexes and this repository's Pages site; changes nothing.
      - name: Which debs each suite wants, and which this run builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: '{"bookworm": "${{ steps.bookworm.outputs.version }}", "trixie": "${{ steps.trixie.outputs.version }}"}'
        run: |
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          python3 packaging/acorn-litepcie/plan.py plan --versions "$VERSIONS" --out dist/plan/plan.json \
            --event "${{ github.event_name }}" ${{ inputs.full && '--full' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: acorn-litepcie-plan
          path: dist/plan/plan.json
          if-no-files-found: error

  driver:
    name: "Driver: generate, patch, CSR cross-check, -common, -dkms, meta"
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install the LiteX environment
        run: uv sync --locked --python 3.12 --extra build

      - name: Generate the driver and apply the packaging patches
        run: uv run --no-project --python 3.12 packaging/acorn-litepcie/prepare_driver.py --out dist/driver

      - name: Cross-check the driver's CSRs against the pinned release
        run: uv run --no-project --python 3.12 packaging/acorn-litepcie/csr_check.py dist/driver

      - name: Install nfpm ${{ env.NFPM_VERSION }}
        run: |
          set -euo pipefail
          f="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$f" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$f"
          echo "${NFPM_SHA256_X86_64}  $f" | sha256sum -c -
          tar xzf "$f" nfpm

      - name: Build -common and -dkms for each suite
        env:
          VERSIONS: ${{ needs.plan.outputs.versions }}
        run: >-
          uv run --no-project --python 3.12 packaging/acorn-litepcie/build_debs.py --out dist/built
          --driver dist/driver --only common --only dkms --nfpm ./nfpm --versions "$VERSIONS"

      - name: Build the meta package
        run: >-
          uv run --no-project --python 3.12 packaging/acorn-litepcie/build_debs.py --out dist/meta
          --only meta --nfpm ./nfpm --version "${{ needs.plan.outputs.meta-version }}"

      - name: Show what was built
        run: |
          for d in dist/built/*.deb dist/meta/*.deb; do echo "== $d"; dpkg-deb -f "$d"; dpkg-deb -c "$d"; done

      - uses: actions/upload-artifact@v4
        with:
          name: acorn-litepcie-driver
          path: dist/driver
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: built-all
          path: dist/built/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: acorn-litepcie-meta
          path: dist/meta/*.deb
          if-no-files-found: error

  utils:
    name: "-utils (${{ matrix.suite }} ${{ matrix.arch }})"
    needs: [plan, driver]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
        arch: [arm64, armhf, amd64]
        include:
          - { arch: arm64, runner: ubuntu-24.04-arm, nfpm: arm64, nfpm_sha256: NFPM_SHA256_ARM64 }
          - { arch: armhf, runner: ubuntu-24.04-arm, nfpm: arm64, nfpm_sha256: NFPM_SHA256_ARM64 }
          - { arch: amd64, runner: ubuntu-latest, nfpm: x86_64, nfpm_sha256: NFPM_SHA256_X86_64 }
    env:
      VERSION: ${{ fromJSON(needs.plan.outputs.versions)[matrix.suite] }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/download-artifact@v4
        with:
          name: acorn-litepcie-driver
          path: dist/driver

      - uses: actions/download-artifact@v4
        with:
          name: built-all
          path: dist/built

      - name: Build the tools in debian:${{ matrix.suite }} (${{ matrix.arch }})
        run: >-
          python3 packaging/acorn-litepcie/container.py run --arch ${{ matrix.arch }} --suite ${{ matrix.suite }} --
          utils --arch ${{ matrix.arch }} --suite ${{ matrix.suite }} --driver dist/driver --out dist/utils

      - name: Install nfpm ${{ env.NFPM_VERSION }}
        env:
          NFPM_ARCH: ${{ matrix.nfpm }}
          NFPM_SHA256: ${{ env[matrix.nfpm_sha256] }}
        run: |
          set -euo pipefail
          f="nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          curl -fsSL -o "$f" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$f"
          echo "${NFPM_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" nfpm

      - name: Build -utils
        run: >-
          uv run --no-project --python 3.12 packaging/acorn-litepcie/build_debs.py --out dist/utils-deb
          --driver dist/driver --only utils --suite ${{ matrix.suite }} --arch ${{ matrix.arch }}
          --bin-dir dist/utils --nfpm ./nfpm --version "$VERSION"

      - name: Install test (-common and -utils, ${{ matrix.suite }} ${{ matrix.arch }})
        run: >-
          python3 packaging/acorn-litepcie/container.py run --arch ${{ matrix.arch }} --suite ${{ matrix.suite }} --
          install-test --arch ${{ matrix.arch }} --suite ${{ matrix.suite }}
          "dist/built/fpgas-online-acorn-litepcie-common_${VERSION}_all.deb"
          "dist/utils-deb/fpgas-online-acorn-litepcie-utils_${VERSION}_${{ matrix.arch }}.deb"

      - name: Show what was built
        run: |
          for d in dist/utils-deb/*.deb; do echo "== $d"; dpkg-deb -f "$d"; dpkg-deb -c "$d"; done

      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.suite }}-${{ matrix.arch }}-utils
          path: dist/utils-deb/*.deb
          if-no-files-found: error

  dkms:
    name: "DKMS build (${{ matrix.suite }} ${{ matrix.arch }}, ${{ matrix.headers }})"
    needs: [plan, driver]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
        arch: [arm64, amd64]
        include:
          - { arch: arm64, runner: ubuntu-24.04-arm, headers: "newest rpi-v8 headers" }
          - { arch: amd64, runner: ubuntu-latest, headers: "Debian's headers" }
    env:
      VERSION: ${{ fromJSON(needs.plan.outputs.versions)[matrix.suite] }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: built-all
          path: dist/built

      - name: Install test (-common and -dkms, and DKMS builds the modules)
        run: >-
          python3 packaging/acorn-litepcie/container.py run --arch ${{ matrix.arch }} --suite ${{ matrix.suite }} --
          dkms-test --arch ${{ matrix.arch }} --suite ${{ matrix.suite }}
          "dist/built/fpgas-online-acorn-litepcie-common_${VERSION}_all.deb"
          "dist/built/fpgas-online-acorn-litepcie-dkms_${VERSION}_all.deb"

  modules:
    name: "-modules (${{ matrix.suite }}, ${{ matrix.kver }})"
    needs: [plan, driver, utils]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/download-artifact@v4
        with:
          name: acorn-litepcie-driver
          path: dist/driver

      - uses: actions/download-artifact@v4
        with:
          name: built-all
          path: dist/built

      - uses: actions/download-artifact@v4
        with:
          name: built-${{ matrix.suite }}-armhf-utils
          path: dist/built

      - uses: actions/download-artifact@v4
        with:
          name: acorn-litepcie-meta
          path: dist/meta

      - name: Build litepcie.ko and liteuart.ko in debian:${{ matrix.suite }} against the kernel's headers
        run: >-
          python3 packaging/acorn-litepcie/container.py run --arch ${{ matrix.arch }} --suite ${{ matrix.suite }} --
          module --suite ${{ matrix.suite }} --arch ${{ matrix.arch }} --kver "${{ matrix.kver }}"
          --driver dist/driver --out dist/modules

      - name: Install nfpm ${{ env.NFPM_VERSION }}
        run: |
          set -euo pipefail
          f="nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz"
          curl -fsSL -o "$f" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$f"
          echo "${NFPM_SHA256_ARM64}  $f" | sha256sum -c -
          tar xzf "$f" nfpm

      - name: Build ${{ matrix.package }}
        run: >-
          uv run --no-project --python 3.12 packaging/acorn-litepcie/build_debs.py --out dist/modules-deb
          --driver dist/driver --only modules --arch ${{ matrix.arch }} --suite ${{ matrix.suite }}
          --kver "${{ matrix.kver }}" --module-dir dist/modules --nfpm ./nfpm
          --version "${{ matrix.version }}"

      - name: Show what was built
        env:
          DEB: dist/modules-deb/${{ matrix.deb }}
        run: |
          dpkg-deb -f "$DEB"
          dpkg-deb -c "$DEB"
          dpkg-deb -I "$DEB" postinst
          dpkg-deb -I "$DEB" postrm
          cat dist/modules/modules.json

      # The netbooted fleet's shape: an armhf root that boots this arm64 kernel. All the suite's packages are
      # offered, so apt could take DKMS for the meta package; it must keep to the modules installed first.
      - name: Install test (armhf ${{ matrix.suite }} root with this kernel, through apt)
        env:
          VERSION: ${{ matrix.version }}
        run: >-
          python3 packaging/acorn-litepcie/container.py run --arch armhf --suite ${{ matrix.suite }} --
          modules-install-test --suite ${{ matrix.suite }} --arch ${{ matrix.arch }} --kver "${{ matrix.kver }}"
          "dist/built/fpgas-online-acorn-litepcie-common_${VERSION}_all.deb"
          "dist/built/fpgas-online-acorn-litepcie-dkms_${VERSION}_all.deb"
          "dist/built/fpgas-online-acorn-litepcie-utils_${VERSION}_armhf.deb"
          "dist/modules-deb/${{ matrix.deb }}"
          dist/meta/fpgas-online-acorn-litepcie_*_all.deb

      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.suite }}-${{ matrix.arch }}-modules-${{ matrix.kver }}
          path: dist/modules-deb/*.deb
          if-no-files-found: error

      # The fleet kernel's litepcie.ko and liteuart.ko as they are, for a host to insmod without a package.
      - uses: actions/upload-artifact@v4
        if: matrix.fleet
        with:
          name: acorn-litepcie-modules-${{ matrix.kver }}
          path: dist/modules
          if-no-files-found: error

  # The modules job is skipped when the site already has every kernel's package, which must not skip the
  # jobs below: they run whenever nothing before them failed.
  assemble:
    name: "debs-${{ matrix.suite }}: from the site what it has, the rest from this run"
    needs: [plan, driver, utils, dkms, modules]
    if: >-
      always() && needs.plan.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: acorn-litepcie-plan
          path: dist/plan

      - uses: actions/download-artifact@v4
        with:
          pattern: built-*
          path: dist/built
          merge-multiple: true

      - name: Assemble the suite
        run: >-
          python3 packaging/acorn-litepcie/plan.py assemble --plan dist/plan/plan.json
          --suite ${{ matrix.suite }} --built dist/built --out dist/debs

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}
          path: dist/debs/*.deb
          if-no-files-found: error
          retention-days: 14

  meta:
    name: "Meta package (${{ matrix.suite }}, plain arm64 host)"
    needs: [plan, assemble]
    if: always() && needs.assemble.result == 'success'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.suite }}
          path: dist/debs

      - uses: actions/download-artifact@v4
        with:
          name: acorn-litepcie-meta
          path: dist/debs

      # The whole assembled suite is offered, the modules packages included, as the published archive offers
      # it: with nothing installed, the meta package's driver must be DKMS.
      - name: Install test (the meta package chooses DKMS)
        run: >-
          python3 packaging/acorn-litepcie/container.py run --arch arm64 --suite ${{ matrix.suite }} --
          meta-install-test --arch arm64 --suite ${{ matrix.suite }} dist/debs/*.deb
