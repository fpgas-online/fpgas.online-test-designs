# .github/workflows/wiring.yml
#
# The wiring sheets, pictures and pin tables in docs/wiring/<board>/generated/ (acorn, tt-fpga) are built
# from that board's wiring.toml. This fails if they are out of date with it (or with the generator), if
# the table does not check, or if the Tiny Tapeout test code's own numbers differ from its wiring.toml.
# The fpgas.online docs copy generated/ from main, so what is here is what readers see.
name: "Wiring sheets"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older, now stale, run.
# Anything else (main, workflow_dispatch) is grouped by commit, so it never waits
# behind or cancels another run: every merge builds, exactly as before.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: "Wiring: tests, and generated/ up to date"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Lint
        run: |
          uv run --no-project --with ruff ruff check docs/wiring
          uv run --no-project --with ruff ruff format --check docs/wiring

      - name: Acorn tests
        # Pillow and fontTools at gen.py's pins: test_steps.py draws a step picture.
        run: >-
          uv run --no-project --python 3.12 --with pytest --with pillow==12.3.0 --with fonttools==4.65.0
          pytest docs/wiring/acorn

      - name: Acorn generated/ matches wiring.toml
        # Pillow and fontTools are pinned in gen.py's script metadata and the fonts are in the repository,
        # so the SVGs and tables come out byte for byte the same here as on the machine that committed them.
        run: uv run --python 3.12 docs/wiring/acorn/gen.py --check

      - name: Tiny Tapeout FPGA tests
        # On their own: this generator's modules have the Acorn generator's names (wiring, tables).
        # test_code_agrees.py reads the test code's own copies of the wiring (designs/) and fails when one
        # differs from wiring.toml.
        run: >-
          uv run --no-project --python 3.12 --with pytest --with fonttools==4.65.0
          pytest docs/wiring/tt-fpga

      - name: Tiny Tapeout FPGA generated/ matches wiring.toml
        run: uv run --python 3.12 docs/wiring/tt-fpga/gen.py --check
