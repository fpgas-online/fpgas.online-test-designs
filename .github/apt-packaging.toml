# How this repository's apt archive is packaged, and why it differs from the defaults.
# See https://github.com/mithro/apt-repo-action/blob/main/docs/packaging.md
#
# The archive holds only the LitePCIe driver packages for the Acorn PCIe SoC (packaging/acorn-litepcie/,
# built with nfpm by .github/workflows/deb.yml): fpgas-online-acorn-litepcie-common, -dkms, -utils and
# -modules-<kver>. The repository's other debs (packaging/debs/, packaging/acorn-pcie/) and the
# fpgas-online-acorn-litepcie meta package are release assets that fpgas-online/apt collects, and are not in
# this archive.

kind = "B"                  # our own code: the driver is generated from this repository's gateware

# The hosts an Acorn can be plugged into: a Raspberry Pi 5 or Compute Module (arm64 kernel, with an arm64 or
# an armhf userland) and an x86-64 PC. The prebuilt modules are arm64 only, for Raspberry Pi kernels.
architectures = ["amd64", "arm64", "armhf"]

# The suites the Raspberry Pi archive has kernels for. No raspbian-<codename> suite: the only armhf hosts
# with PCIe are 64-bit Pis running a 32-bit userland, which run Debian's ARMv7 build.
suites = ["bookworm", "trixie"]

[exceptions]
PKG-ARCH = "hardware-specific: SQRL Acorn (CLE-215+, CLE-215, CLE-101; an M.2 PCIe FPGA card), in a Raspberry Pi 5 or Compute Module or an x86-64 PC"
PKG-SUITES = "fpgas.online uses it; the modules are built against Raspberry Pi kernels, which exist for bookworm and trixie only"
PKG-TRIGGERS = "daily: a new Raspberry Pi kernel needs its modules package, and no commit here says it appeared"
