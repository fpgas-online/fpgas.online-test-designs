# Where the parts of each thing are, in millimetres. Every table names its source; the figures marked
# "measured" are the ones `uv run docs/wiring/acorn/measure_hat.py --mm` prints, and test_wiring.py checks them.

[things.hat]
name = "Waveshare PoE M.2 HAT+ (B)"
size = [55.92, 84.99]
source = "the maker's dimension drawing (wiring.toml [carriers.pi5.hat] drawing): 85.00 mm long, mounting holes 58.00 x 49.00 mm, 3.50 mm from the pin 1 end; measured in the photo by measure_hat.py (the board's outline there, from the first dark pixel to one past the last), x at the scale the holes' 49.00 mm gives and y at the scale their 58.00 mm gives"

[things.hat.photos.top]
file = "hat-plus-b-ccw.jpg"
px_per_mm = [8.173, 8.177]
origin = [10.0, 15]

[things.hat.headers.header]
face = "top"
label = ""
columns = 2
rows = 20
numbering = "across"
pitch = 2.54
pin = 0.64
pin1 = [51.11, 8.27]
source = "Raspberry Pi 40-pin header, 2.54 mm; 0.64 mm square pins: the 2.54 mm header's standard post; position measured in the photo by measure_hat.py (x at the scale the holes' 49.00 mm gives, y at the scale their 58.00 mm gives)"

[things.hat.items.m2-slot]
kind = "slot"
face = "top"
box = [6.85, 0.86, 29.24, 10.03]
source = "measured in the photo by measure_hat.py (the grey socket moulding; x at the scale the holes' 49.00 mm gives, y at the scale their 58.00 mm gives)"

# The card: every figure marked "measured" is one `uv run docs/wiring/acorn/measure_card.py` prints, and
# test_card.py checks them. Boxes are in the card's own frame (its top face from above, x mirrored from the
# photo, which shows the underside); y runs from the end away from the M.2 edge. The photo covers only `shown`.
# The card's figures are to 0.1 mm: the photo does not carry more (a half-size copy of it moves a figure by
# 0.4 mm). The photo is not taken square-on, so it has two scales: x at the scale the card's 22.00 mm width
# gives, y at the scale the sockets' 1.20 mm contact pitch gives.
[things.acorn]
name = "SQRL Acorn"
size = [22.0, 80.0]
source = "22 x 80 mm, M.2 2280: the board maker's repository (wiring.toml [[sources]], \"The card's form\")"

[things.acorn.photos.bottom]
file = "acorn-cw.jpg"
px_per_mm = [23.056, 22.482]
origin = [0.9, 22]
shown = [0, 47.9]

[things.acorn.items.p1]
kind = "socket"
face = "bottom"
label = "P1"
box = [16.4, 13.6, 21.9, 23.2]
pin1 = [19.0, 21.3]
source = "measured in the vendor's underside photo by measure_card.py (the silkscreen outline round the socket; pin 1 the contact nearest the M.2 edge); x at the scale the card's 22.00 mm width gives, y at the scale the contacts' 1.20 mm pitch gives. Assumed from position, not read: the socket nearer the M.2 edge is P1: the vendor's photo and the wiki's legend"

[things.acorn.items.p2]
kind = "socket"
face = "bottom"
label = "P2"
box = [16.1, 3.0, 21.5, 12.7]
pin1 = [19.4, 10.6]
source = "measured in the vendor's underside photo by measure_card.py (the silkscreen outline round the socket; pin 1 the contact nearest the M.2 edge); x at the scale the card's 22.00 mm width gives, y at the scale the contacts' 1.20 mm pitch gives. Assumed from position, not read: the socket further from the M.2 edge is P2: the vendor's photo and the wiki's legend"

[things.acorn.items.pad]
kind = "pad"
face = "bottom"
label = ""
box = [8.4, 0.0, 13.6, 2.7]
source = "measured in the vendor's underside photo by measure_card.py (the gold of the half-round plated pad at the card's end); x at the scale the card's 22.00 mm width gives, y at the scale the contacts' 1.20 mm pitch gives"
