# Where the parts of each thing are, in millimetres. Every table names its source; the figures marked
# "measured" are the ones `uv run docs/wiring/acorn/measure_hat.py --mm` prints, and test_wiring.py checks them.

[things.hat]
name = "Waveshare PoE M.2 HAT+ (B)"
size = [55.77, 84.87]
source = "the maker's dimension drawing (wiring.toml [carriers.pi5.hat] drawing): 85.00 mm long, mounting holes 58.00 x 49.00 mm, 3.50 mm from the pin 1 end; measured in the photo by measure_hat.py (the board's outline there)"

[things.hat.photos.top]
file = "hat-plus-b-ccw.jpg"
px_per_mm = 8.177
origin = [10.0, 15]

[things.hat.headers.header]
face = "top"
label = ""
columns = 2
rows = 20
numbering = "across"
pitch = 2.54
pin1 = [51.02, 8.21]
source = "Raspberry Pi 40-pin header, 2.54 mm; position measured in the photo by measure_hat.py"

[things.hat.items.m2-slot]
kind = "slot"
face = "top"
box = [6.85, 0.86, 29.23, 10.03]
source = "measured in the photo by measure_hat.py (the grey socket moulding)"

# The card: every figure marked "measured" is one `uv run docs/wiring/acorn/measure_card.py` prints, and
# test_card.py checks them. Boxes are in the card's own frame (its top face from above, x mirrored from the
# photo, which shows the underside); y runs from the end away from the M.2 edge. The photo covers only `shown`.
[things.acorn]
name = "SQRL Acorn"
size = [22.0, 80.0]
source = "22 x 80 mm, M.2 2280: the board maker's repository (wiring.toml [[sources]], \"The card's form\")"

[things.acorn.photos.bottom]
file = "acorn-cw.jpg"
px_per_mm = 23.056
origin = [0.9, 22]
shown = [0, 46.76]

[things.acorn.items.p1]
kind = "socket"
face = "bottom"
label = "P1"
box = [16.44, 13.23, 21.87, 22.64]
pin1 = [19.06, 20.75]
source = "measured in the vendor's underside photo by measure_card.py (the silkscreen outline round the socket; pin 1 the contact nearest the M.2 edge); scale from the card's 22.00 mm width, checked against the contacts' 1.20 mm pitch"

[things.acorn.items.p2]
